[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astroguard"
version = "0.1.0"
description = "Spacecraft telemetry intelligence and anomaly detection research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
database = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
]

ml = [
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    "joblib>=1.4,<2.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"